name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/components/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
        env:
          VITEPRESS_BASE: /vela/
      - run: pnpm --filter @vela/app-components build
        env:
          VITE_BASE: /vela/components/
      - name: Add component gallery to site
        run: |
          mkdir -p docs/.vitepress/dist/components
          cp -R apps/components/dist/. docs/.vitepress/dist/components/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
